  actual_col : NO_OF_NEW_JOINEES
  predicted_base_col : FINAL_BASE
  tpr_col : PROMO_JOINS

  train_test_rsq_mape_check_needed : yes
  rsq_mape_check_needed : no

  rsq_cutoff : 0.4
