data_harmonization_inputs:
  regions : ["MI-01","NY-01"]
  min_year : 2022
  max_year : 2026

general_inputs :
  dependent_variable : NO_OF_NEW_JOINEES
  date_var : START_OF_WEEK
  date_format_pyspark : "yyyy-MM-dd"
  date_format_pandas : "yyyy-MM-dd"
  modeling_granularity : ["REGIONNAME","F_CODE"]
  output_database : ORANGE_ZONE_SBX_TA
  output_schema : PUBLIC

data_processing :
  outlier_treatment_needed : yes #yes/no
  outlier_treatment :
    algorithm : inter_quartile_range
    hampel_filter :
      window_size : 2
      no_of_sigmas : 3
    inter_quartile_range :
      minimum_quantile : 5
      maximum_quantile : 95
  
  standardization_needed : yes

  missing_dates_treatment_needed : yes
  
  missing_value_treatment_needed: yes
  missing_value_treatment :
    Mean :
      cols : ["NO_OF_NEW_JOINEES"]
      zero_as_missing_value : False
    Median :
      cols : []
      zero_as_missing_value : False
    Scalar :
      cols : []
      value : 0
      zero_as_missing_value : False
    Rolling_Mean :
      cols : []
      window : 4
      zero_as_missing_value : False
    Rolling_Median :
      cols : []
      window : 4
      zero_as_missing_value : False
    Forward_fill :
      cols : ["REGIONAL_CPI","REGIONAL_UNEMPLOYMENT_RATE","HPI"]
      zero_as_missing_value : False
    Backward_fill :
      cols : []
      zero_as_missing_value : False
    Linear_Interpolation :
      cols : []
      zero_as_missing_value : False
    Spline_Interpolation :
      cols : []
      zero_as_missing_value : False
    Mode :
      cols : []
    Mean_Across_Years :
      cols : []
      time_granularity : daily
      zero_as_missing_value : False
    Zero:
      cols : ["TOTAL_SPENDS_OVERALL","PRIMED_LEADS","PROMO_WEIGHTED_MEAN","SUMMER_WEIGHTED_MEAN","AOJO_WEIGHTED_MEAN","NEWVEMBER_WEIGHTED_MEAN","RR_WEIGHTED_MEAN","WINBACK_CORP_WEIGHTED_MEAN","DECEMBER_WEIGHTED_MEAN","OTHER_WEIGHTED_MEAN","AOAO_WEIGHTED_MEAN","FOUNDER_WEIGHTED_MEAN","FMF_WEIGHTED_MEAN","NMF_WEIGHTED_MEAN","KICK_START_WEIGHTED_MEAN","FM_WEIGHTED_MEAN","DSO_WEIGHTED_MEAN","P65_WEIGHTED_MEAN","CORP_WEIGHTED_MEAN","WINBACK_WEIGHTED_MEAN","FAO_WEIGHTED_MEAN","SPRING_WEIGHTED_MEAN",
              "PROMO_WEIGHTED_MEAN_STREAK","SUMMER_WEIGHTED_MEAN_STREAK","AOJO_WEIGHTED_MEAN_STREAK","NEWVEMBER_WEIGHTED_MEAN_STREAK","RR_WEIGHTED_MEAN_STREAK","WINBACK_CORP_WEIGHTED_MEAN_STREAK","DECEMBER_WEIGHTED_MEAN_STREAK","OTHER_WEIGHTED_MEAN_STREAK","AOAO_WEIGHTED_MEAN_STREAK","FOUNDER_WEIGHTED_MEAN_STREAK","FMF_WEIGHTED_MEAN_STREAK","NMF_WEIGHTED_MEAN_STREAK","KICK_START_WEIGHTED_MEAN_STREAK","FM_WEIGHTED_MEAN_STREAK","DSO_WEIGHTED_MEAN_STREAK","P65_WEIGHTED_MEAN_STREAK","CORP_WEIGHTED_MEAN_STREAK","WINBACK_WEIGHTED_MEAN_STREAK","FAO_WEIGHTED_MEAN_STREAK","SPRING_WEIGHTED_MEAN_STREAK",
              "FMF_ACTIVE_STUDIOS_NORMALIZED","NMF_ACTIVE_STUDIOS_NORMALIZED","FM_ACTIVE_STUDIOS_NORMALIZED","KICK_START_ACTIVE_STUDIOS_NORMALIZED","FOUNDER_ACTIVE_STUDIOS_NORMALIZED","RR_ACTIVE_STUDIOS_NORMALIZED","WINBACK_CORP_ACTIVE_STUDIOS_NORMALIZED","SUMMER_ACTIVE_STUDIOS_NORMALIZED","AOJO_ACTIVE_STUDIOS_NORMALIZED","NEWVEMBER_ACTIVE_STUDIOS_NORMALIZED","OTHER_ACTIVE_STUDIOS_NORMALIZED","AOAO_ACTIVE_STUDIOS_NORMALIZED","DSO_ACTIVE_STUDIOS_NORMALIZED","PROMO_ACTIVE_STUDIOS_NORMALIZED","P65_ACTIVE_STUDIOS_NORMALIZED","CORP_ACTIVE_STUDIOS_NORMALIZED","WINBACK_ACTIVE_STUDIOS_NORMALIZED","FAO_ACTIVE_STUDIOS_NORMALIZED","SPRING_ACTIVE_STUDIOS_NORMALIZED",
