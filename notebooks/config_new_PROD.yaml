feature_engineering_details :

  lag_lead_needed: yes
  featurewise_lag_lead_dict:
    LOCAL_CAMPAIGN_LEADS : ["lag", [1, 2, 3], 0]
    TOTAL_SPENDS_OVERALL : ["lag", [1, 2], 0]
    NATIONAL_CAMPAIGN_LEADS: ["lead", [1, 2], 0]
  
  log_transformation_needed: yes
  log_transformation_features:
    - NO_OF_NEW_JOINEES

  si_needed: yes
  si_target_column: NON_PROMO_JOINS
  categorical_columns_ads:
    - REGIONNAME


